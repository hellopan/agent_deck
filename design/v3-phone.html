<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentDeck 手机端 · 改版</title>
<style>
:root{
  --bg:#f7f4ef; --card:#fff; --line:#e9e3da; --line2:#f1ece5;
  --ink:#1b1f24; --ink2:#5f6058; --ink3:#9c9a92;
  --act:#1b1f24; --act-h:#2b3138; --on-act:#fff; --warm:#a16207;
  --green:#15803d; --green-bg:#ecf7ef; --green-line:#cfe8d8;
  --red:#b42318; --red-bg:#fdeceb; --red-line:#f6d3d0; --on-red:#fff;
  --amber:#a16207; --amber-bg:#fdf7e6; --amber-line:#f0e2bd;
  --desk:#ebe7e0; --phone-line:#d9d3ca; --phone-shadow:0 10px 28px rgba(40,35,28,.10),0 1px 2px rgba(40,35,28,.06);
  --seg-on:#f2efe9; --tag-done:#f2f0eb; --off-bar:#cfcabf;
  --ev-dot:#c9c4ba; --ev-file:#c99a3f; --ev-msg:#9aa0a6; --ev-line:#e4ded3;
  --code-bg:#f6f3ee; --pv-bg:#f8f7f4;
  --dock-fade:rgba(247,244,239,0); --dock-shadow:0 2px 8px rgba(40,35,28,.04);
  --tabbar:#fbf9f6; --indicator:#c9c4ba; --badge-ring:#fbf9f6;
  --soft:#f4f2ee; --ready-off:#e6e0d7; --dot-off:#c2beb5;
  --fab:#fff; --fab-line:#d9d3ca;
  --mono:ui-monospace,"Cascadia Mono","Consolas","SF Mono",monospace;
}
:root.dark{
  --bg:#161513; --card:#1e1c19; --line:#2f2c27; --line2:#262420;
  --ink:#e8e5df; --ink2:#a8a49b; --ink3:#767268;
  --act:#e8e5df; --act-h:#f6f3ec; --on-act:#161513; --warm:#d9a23c;
  --green:#3fb950; --green-bg:#13261a; --green-line:#1f4a2c;
  --red:#f85149; --red-bg:#2a1614; --red-line:#52241f; --on-red:#161513;
  --amber:#d9a23c; --amber-bg:#2a2113; --amber-line:#453520;
  --desk:#0a0b0c; --phone-line:#33383d; --phone-shadow:0 10px 28px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.4);
  --seg-on:#2a2724; --tag-done:#23272b; --off-bar:#3a3f45;
  --ev-dot:#4a5158; --ev-file:#d9a23c; --ev-msg:#7c848c; --ev-line:#443e36;
  --code-bg:#101210; --pv-bg:#1f2225;
  --dock-fade:rgba(22,21,19,0); --dock-shadow:0 2px 8px rgba(0,0,0,.3);
  --tabbar:#131211; --indicator:#4a5158; --badge-ring:#131211;
  --soft:#23272b; --ready-off:#2a2724; --dot-off:#555b62;
  --fab:#1e1c19; --fab-line:#33383d;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--desk); padding:36px 24px 60px;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  color:var(--ink); -webkit-font-smoothing:antialiased;
}
.wall{display:grid;grid-template-columns:repeat(3,393px);gap:40px 32px;justify-content:center}
figure{margin:0}
figcaption{margin-top:12px;font-size:12px;color:var(--ink3);text-align:center;letter-spacing:.2px}
figcaption b{font-weight:500;color:var(--ink)}
.phone{
  width:393px;height:852px;border-radius:34px;background:var(--bg);
  border:1px solid var(--phone-line);overflow:hidden;position:relative;
  box-shadow:var(--phone-shadow);
  display:flex;flex-direction:column;
}
/* status bar */
.statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:12px;font-weight:500;color:var(--ink)}
.sb-r{display:flex;align-items:center;gap:5px;color:var(--ink)}
/* app bar */
.appbar{flex:none;padding:2px 18px 10px;display:flex;align-items:flex-start;gap:10px}
.ab-main{flex:1;min-width:0}
.ab-title{font-size:17px;font-weight:600;letter-spacing:.1px;display:flex;align-items:center;gap:6px}
.ab-sub{font-size:12.5px;color:var(--ink3);margin-top:2px;display:flex;align-items:center;gap:6px}
.ab-act{flex:none;display:flex;align-items:center;gap:14px;padding-top:3px;color:var(--ink2)}
.chev{color:var(--ink3)}
.back{width:26px;height:26px;display:grid;place-items:center;margin-left:-6px;color:var(--ink);flex:none}
.body{flex:1;min-height:0;overflow:hidden;padding:0 16px}
h1.page{font-size:19px;font-weight:600;margin:2px 0 2px;letter-spacing:.2px}
.page-sub{font-size:12.5px;color:var(--ink3);margin-bottom:12px}
/* blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card.flat{padding:0;overflow:hidden}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:2px 0 12px}
.seg div{flex:1;text-align:center;padding:7px 0;font-size:13px;color:var(--ink2);border-radius:11px}
.seg div.on{background:var(--seg-on);color:var(--ink);font-weight:500}
.seg b{font-family:var(--mono);font-weight:500;font-size:13px}
.grp{font-size:12px;color:var(--ink3);margin:14px 2px 8px;display:flex;align-items:center;gap:6px}
/* approval card */
.ap{position:relative;padding-left:16px}
.ap::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--red)}
.ap.off::before{background:var(--off-bar)}
.card.run{position:relative;padding-left:16px}
.card.run::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--green)}
.ap-top{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink3)}
.ap-top .rt{margin-left:auto;font-family:var(--mono);font-size:11.5px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:500;letter-spacing:.2px}
.tag.cmd{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}
.tag.file{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-line)}
.tag.run{background:var(--green-bg);color:var(--green);border:1px solid var(--green-line)}
.tag.done{background:var(--tag-done);color:var(--ink2);border:1px solid var(--line)}
.ap-cmd{font-size:14.5px;margin:7px 0 6px;word-break:break-all;line-height:1.45;font-weight:500}
.ap-cmd.mono{font-family:var(--mono);font-size:13.5px;font-weight:400}
.ap-cmd .p{font-family:var(--mono);font-size:13.5px}
.ap-cmd .d{color:var(--ink2);font-size:13px;font-weight:400}
.mono{font-family:var(--mono)}
.ap-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3)}
.ap-meta .r{margin-left:auto;color:var(--red);font-weight:500}
/* running */
.run-title{font-size:14.5px;font-weight:500;line-height:1.45;margin:6px 0 8px}
.run-foot{display:flex;align-items:center;font-size:12px;color:var(--ink3)}
.run-foot .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.link{color:var(--warm);font-size:12.5px;text-decoration:none}
.link.danger{color:var(--red)}
.more{font-size:12px;color:var(--ink3);text-align:center;padding:12px 0 4px}
/* dock */
.dock{flex:none;padding:8px 16px 6px;background:linear-gradient(to bottom,var(--dock-fade),var(--bg) 22%)}
.dock-box{display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:var(--dock-shadow)}
.dock-box .ph{flex:1;font-size:14px;color:var(--ink3);padding:6px 0;min-height:32px}
.send{width:34px;height:34px;border-radius:50%;background:var(--act);display:grid;place-items:center;flex:none;color:var(--on-act)}
.dock-hint{font-size:11px;color:var(--ink3);text-align:center;padding:7px 0 0}
/* tabbar */
.tabbar{flex:none;height:60px;display:flex;align-items:flex-start;padding-top:8px;border-top:1px solid var(--line);background:var(--tabbar)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink3);position:relative}
.tb.on{color:var(--act);font-weight:600}
.tb .badge{position:absolute;top:-3px;left:calc(50% + 8px);box-shadow:0 0 0 1.5px var(--badge-ring);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:var(--on-red);font:500 10px/16px var(--mono);text-align:center}
.home-ind{flex:none;height:18px;display:grid;place-items:center;background:var(--tabbar)}
/* 破坏性操作的二次确认：遮罩压暗整屏，对话框居中，危险动作只在右侧出现一次 */
.scrim{position:absolute;inset:0;background:rgba(26,22,17,.44);z-index:4}
:root.dark .scrim{background:rgba(0,0,0,.58)}
.dlg{position:absolute;left:22px;right:22px;top:50%;transform:translateY(-50%);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 12px;box-shadow:0 14px 34px rgba(30,25,18,.24)}
.dlg-t{font-size:15px;font-weight:600;letter-spacing:-.1px}
.dlg-b{font-size:12.5px;color:var(--ink2);line-height:1.62;margin-top:8px}
.dlg-a{display:flex;justify-content:flex-end;gap:4px;margin-top:14px}
.dlg-btn{font-size:13px;padding:9px 13px;border-radius:10px;color:var(--ink3)}
.dlg-btn.danger{color:var(--red);background:var(--red-bg);font-weight:500}
.home-ind i{width:134px;height:4px;border-radius:2px;background:var(--indicator);display:block}
/* detail */
.cmdblock{background:var(--code-bg);border:1px solid var(--line2);border-radius:12px;padding:12px;font-family:var(--mono);font-size:13.5px;line-height:1.55;word-break:break-all;margin:10px 0 4px}
.kv{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{width:84px;flex:none;color:var(--ink3);font-size:12.5px}
.kv .v{flex:1;min-width:0}
.kv .v.mono{font-family:var(--mono);font-size:12.5px}
.note{display:flex;gap:8px;font-size:12px;color:var(--ink3);line-height:1.55;padding:10px 2px}
.note b{font-weight:500;color:var(--ink2)}
.btn{height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;width:100%;border:1px solid transparent}
.btn.primary{background:var(--act);color:var(--on-act);box-shadow:0 1px 2px rgba(20,24,28,.20)}
.btn.primary:active{background:var(--act-h)}
.btn.ghost{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn.sm{height:36px;font-size:13px;width:auto;padding:0 14px;border-radius:10px}
.btn-row{display:flex;gap:10px;margin:14px 0 6px}
/* events */
.ev{position:relative;padding:0 0 14px 22px;font-size:13px;line-height:1.5}
.ev::before{content:"";position:absolute;left:5px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--ev-dot);border:1.5px solid var(--bg)}
.ev::after{content:"";position:absolute;left:8px;top:15px;bottom:-6px;width:1px;background:var(--ev-line)}
.ev:last-child::after{display:none}
.ev .t{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-right:6px}
.ev.cmd::before{background:var(--red)}
.ev.file::before{background:var(--ev-file)}
.ev.msg::before{background:var(--ev-msg)}
.ev.ok::before{background:var(--green)}
.ev .c{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);border-radius:6px;padding:5px 8px;margin-top:5px;display:block;word-break:break-all}
.trace{display:flex;flex-direction:column}
.stream{margin-top:auto}
.pv{display:flex;align-items:center;gap:10px;background:var(--pv-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:2px 0 12px}
.pv .ic{width:30px;height:30px;border-radius:9px;background:var(--card);display:grid;place-items:center;color:var(--green);flex:none}
.pv .tt{font-size:13px;font-weight:500}
.pv .ss{font-size:11.5px;color:var(--ink3);font-family:var(--mono)}
.pv .go{margin-left:auto}
/* device */
.dev{display:flex;align-items:flex-start;gap:10px}
.dev .nm{font-size:15.5px;font-weight:600}
.dev .meta{font-size:11.5px;color:var(--ink3);margin-top:3px}
.dev .r{margin-left:auto;flex:none}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--green);vertical-align:1px}
.dot.off{background:var(--dot-off)}
.dot.amber{background:var(--ev-file)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;font-size:11.5px;border:1px solid var(--line);color:var(--ink2);background:var(--card)}
.pill.ok{color:var(--green);background:var(--green-bg);border-color:var(--green-line)}
.pill.off{color:var(--ink3);background:var(--soft)}
.pill.warn{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-line)}
.readiness{display:flex;gap:6px;margin-top:12px}
.readiness i{height:4px;border-radius:2px;background:var(--green-line);flex:1}
.readiness i.on{background:var(--green)}
.readiness i.off{background:var(--ready-off)}
.proj-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.proj-row:last-child{border-bottom:0}
.proj-row .p{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:2px}
.proj-row .r{margin-left:auto}
.eng{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13px}
.eng:last-child{border-bottom:0}
.eng .v{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.sec-title{font-size:12px;color:var(--ink3);margin:16px 2px 8px}
body.only .wall{grid-template-columns:393px;padding-top:0}
body.only{background:var(--bg);padding:20px}
body.only figcaption{display:none}
.theme-fab{position:fixed;top:16px;right:18px;width:34px;height:34px;border-radius:50%;border:1px solid var(--fab-line);background:var(--fab);color:var(--ink2);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.10);z-index:9}
.theme-fab:hover{color:var(--ink)}
body.only .theme-fab{display:none}
html.dark .i-sun{display:none}
html:not(.dark) .i-moon{display:none}
</style>
<script>
(function(){

  if (dark) document.documentElement.classList.add('dark');
})();
</script>

<div class="phone">
